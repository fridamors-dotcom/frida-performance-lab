<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1eb" />
  <title>Frida Performance Lab</title>
  <link rel="apple-touch-icon" href="Minimalist%20Blush%20Pink%20F%20Icon.png" />
  <link rel="icon" type="image/png" href="Minimalist%20Blush%20Pink%20F%20Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <p class="eyebrow">FRIDA · PERFORMANCE LAB</p>
      <div class="week-head">
        <div>
          <h1 id="weekTitle">Uge 41</h1>
          <p><strong id="weekKm">24 km</strong> planlagt</p>
        </div>
        <div class="week-nav" aria-label="Skift uge">
          <button id="todayBtn" class="icon-btn" aria-label="Gå til denne uge">↻</button>
          <button id="prevBtn" class="icon-btn" aria-label="Forrige uge">‹</button>
          <span id="weekLabel">Uge 41</span>
          <button id="nextBtn" class="icon-btn" aria-label="Næste uge">›</button>
        </div>
      </div>
    </header>
    <section id="planPage" class="page active"><section id="workouts" class="workouts" aria-live="polite"></section></section>
    <section id="progressPage" class="page progress-page">
      <div class="progress-section">
        <div class="section-head"><div><p class="section-kicker">UGENTLIG VOLUME</p><h2>Kilometer</h2></div><span>Planlagt</span></div>
        <div id="kmChart" class="km-chart"></div>
      </div>
      <div class="progress-section">
        <div class="section-head"><div><p class="section-kicker">PERSONLIGE REKORDER</p><h2>PB's</h2></div></div>
        <div class="records">
          <div class="record"><span>5 km</span><strong>33:00</strong></div>
          <div class="record"><span>10 km</span><strong>1:10:00</strong></div>
          <div class="record"><span>Længste tur</span><strong>10 km</strong></div>
          <div class="record"><span>Halvmarathon</span><strong>—</strong></div>
        </div>
      </div>
      <div class="progress-section consistency">
        <p class="section-kicker">CONSISTENCY</p>
        <div class="consistency-main"><strong id="consistencyValue">0</strong><span>uger i træk<br>med mindst 2 løb</span></div>
        <p id="consistencyNote">Vi bygger din streak op herfra.</p>
      </div>
    </section>
    <nav class="bottom-nav" aria-label="Navigation">
      <button class="nav-item active" data-page="planPage"><span>⌁</span>Plan</button>
      <button class="nav-item" data-page="progressPage"><span>↗</span>Progress</button>
    </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
